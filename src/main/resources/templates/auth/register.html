<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main(~{::title}, ~{::section}, 'register')}">
<head>
    <title>Create Student Account - Exam Review Portal</title>
</head>
<body>
<section>
    <div style="max-width: 500px; margin: var(--space-8) auto;">
        <div class="card">
            <div style="text-align: center; margin-bottom: var(--space-4);">
                <div class="font-mono text-emerald" style="font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: var(--space-2);">
                    [ EVALIS // STUDENT_REGISTRATION ]
                </div>
                <h1 class="page-title">Create Account</h1>
                <p class="page-subtitle">Register to view question-wise marks and request re-evaluations</p>
            </div>

            <!-- Server Error Banner -->
            <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: var(--space-4);" th:text="${errorMessage}">
                Registration error occurred.
            </div>

            <form th:action="@{/register}" th:object="${registerForm}" method="post">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Jane Doe" required autofocus>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error">Name error</div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">University Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control font-mono" placeholder="student@example.com" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error">Email error</div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control font-mono" placeholder="••••••••" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error">Password error</div>
                    <div class="form-helper">Minimum 6 characters.</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control font-mono" placeholder="••••••••" required>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error">Confirm password error</div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
                    Create Student Account
                </button>
            </form>

            <div style="margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--bento-border); text-align: center;">
                <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
                    Already registered?
                    <a th:href="@{/login}" style="color: var(--color-primary); font-weight: var(--font-weight-semibold); text-decoration: none; margin-left: var(--space-1);">
                        Sign In &rarr;
                    </a>
                </span>
            </div>
        </div>
    </div>
</section>
</body>
</html>
