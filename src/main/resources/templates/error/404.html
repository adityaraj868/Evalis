<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main(~{::title}, ~{::section}, 'error')}">
<head>
    <title>Resource Not Found - 404</title>
</head>
<body>
<section>
    <div style="max-width: 600px; margin: var(--space-8) auto; text-align: center;">
        <div class="card">
            <div style="font-size: 3rem; margin-bottom: var(--space-2);">🔍</div>
            <h1 class="page-title" style="color: var(--color-warning);">Not Found (404)</h1>
            <p class="page-subtitle" style="margin-bottom: var(--space-6);" th:text="${errorMessage ?: 'The requested resource was not found.'}">
                The requested resource could not be found.
            </p>
            <a th:href="@{/}" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</section>
</body>
</html>
