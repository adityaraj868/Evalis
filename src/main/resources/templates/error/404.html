<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main(~{::title}, ~{::section}, 'error')}">
<head>
    <title>Resource Not Found - 404</title>
</head>
<body>
<section>
    <div style="max-width: 640px; margin: var(--space-8) auto; text-align: center;">
        <div class="card">
            <div class="ascii-art-box">
+---------------------------------------+
|  [?] 404 - RESOURCE_NOT_LOCATED       |
|  TELEMETRY: TARGET_ENTITY_NULL        |
+---------------------------------------+
     / \
    /   \   [NOT_FOUND]
   /_____\</div>
            <h1 class="page-title text-emerald">Resource Not Found (404)</h1>
            <p class="page-subtitle" style="margin-bottom: var(--space-6);" th:text="${errorMessage ?: 'The requested resource was not found.'}">
                The requested resource could not be found.
            </p>
            <div style="display: flex; justify-content: center; gap: var(--space-3);">
                <a th:href="@{/}" class="btn btn-primary">Return to Home</a>
                <button onclick="window.history.back()" class="btn btn-secondary">Go Back</button>
            </div>
        </div>
    </div>
</section>
</body>
</html>
