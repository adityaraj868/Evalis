<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main(~{::title}, ~{::section}, 'requests')}">
<head>
    <title>My Re-evaluation Requests - Exam Review Portal</title>
</head>
<body>
<section>
    <div class="page-header">
        <h1 class="page-title">My Re-evaluation Requests</h1>
        <p class="page-subtitle">Track the review status and final faculty decisions for your submitted requests</p>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(requests)}" style="color: var(--color-muted); padding: var(--space-4) 0;">
            No re-evaluation requests submitted yet.
        </div>

        <div th:if="${!#lists.isEmpty(requests)}" class="table-container" style="margin-bottom: 0;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Request ID</th>
                        <th>Examination</th>
                        <th>Question</th>
                        <th>Submitted At</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${requests}">
                        <td>#<span th:text="${r.id}">1</span></td>
                        <td><strong th:text="${r.exam.name}">Data Structures</strong></td>
                        <td>Question <span th:text="${r.question.questionNumber}">4</span></td>
                        <td th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy HH:mm')}">Time</td>
                        <td>
                            <div th:replace="~{fragments/badges :: requestStatus(${r.status})}"></div>
                        </td>
                        <td>
                            <a th:href="@{'/student/requests/' + ${r.id}}" class="btn btn-secondary btn-sm">Track & Details</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
