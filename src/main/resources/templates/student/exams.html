<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main(~{::title}, ~{::section}, 'exams')}">
<head>
    <title>My Examinations - Exam Review Portal</title>
</head>
<body>
<section>
    <div class="page-header">
        <h1 class="page-title">My Examinations</h1>
        <p class="page-subtitle">Select an exam to view detailed question-wise marks and request re-evaluations</p>
    </div>

    <div class="card">
        <div th:if="${#lists.isEmpty(results)}" style="color: var(--color-muted); padding: var(--space-4) 0;">
            No examination results currently available.
        </div>

        <div th:if="${!#lists.isEmpty(results)}" class="table-container" style="margin-bottom: 0;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Examination Name</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Re-evaluation Period</th>
                        <th>Total Marks</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${results}">
                        <td><strong th:text="${r.exam.name}">Exam</strong></td>
                        <td th:text="${r.exam.subject}">Subject</td>
                        <td>
                            <div th:replace="~{fragments/badges :: examStatus(${r.exam.status})}"></div>
                        </td>
                        <td>
                            <span th:if="${r.exam.reevaluationStart != null}"
                                  th:text="${#temporals.format(r.exam.reevaluationStart, 'dd MMM')} + ' - ' + ${#temporals.format(r.exam.reevaluationEnd, 'dd MMM yyyy')}">
                                Window
                            </span>
                            <span th:if="${r.exam.reevaluationStart == null}" style="color: var(--color-muted);">Not Scheduled</span>
                        </td>
                        <td><strong th:text="${r.totalMarks}">0.0</strong></td>
                        <td>
                            <a th:href="@{'/student/exams/' + ${r.exam.id}}" class="btn btn-primary btn-sm">View Marks & Details</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
