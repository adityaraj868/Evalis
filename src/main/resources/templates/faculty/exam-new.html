<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main(~{::title}, ~{::section}, 'exams')}">
<head>
    <title>Create Examination - Faculty</title>
</head>
<body>
<section>
    <div style="margin-bottom: var(--space-4);">
        <a th:href="@{/faculty/exams}" style="color: var(--color-primary); font-size: var(--font-size-sm); text-decoration: none;">&larr; Back to Exams</a>
    </div>

    <div style="max-width: 800px; margin: 0 auto;">
        <div class="card">
            <div class="page-header" style="border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-4);">
                <h1 class="page-title">Create Examination</h1>
                <p class="page-subtitle">Define examination parameters, schedule dates, and input initial questions</p>
            </div>

            <form th:action="@{/faculty/exams/new}" method="post">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                    <div class="form-group">
                        <label for="name" class="form-label">Examination Title <span style="color: var(--color-danger);">*</span></label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Operating Systems Final Exam" required>
                    </div>

                    <div class="form-group">
                        <label for="subject" class="form-label">Subject Code / Name <span style="color: var(--color-danger);">*</span></label>
                        <input type="text" id="subject" name="subject" class="form-control" placeholder="e.g. CS301 - Operating Systems" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                    <div class="form-group">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="date" id="startDate" name="startDate" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="date" id="endDate" name="endDate" class="form-control">
                    </div>
                </div>

                <div style="margin-top: var(--space-6); border-top: 1px solid var(--color-border); padding-top: var(--space-4);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
                        <h2 class="card-title" style="margin-bottom: 0;">Examination Questions</h2>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="addQuestionRow()">+ Add Question</button>
                    </div>

                    <div id="questionsContainer" style="display: flex; flex-direction: column; gap: var(--space-4);">
                        <div class="question-row" style="background: var(--color-surface-hover); padding: var(--space-4); border-radius: var(--radius-md);">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
                                <strong>Question 1</strong>
                                <div style="display: flex; align-items: center; gap: var(--space-2);">
                                    <label class="form-label" style="margin-bottom: 0;">Max Marks:</label>
                                    <input type="number" step="0.5" name="maxMarks" value="10.0" class="form-control" style="width: 90px;" required>
                                </div>
                            </div>
                            <textarea name="questionTexts" rows="2" class="form-control" placeholder="Enter question statement..." required></textarea>
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-6);">
                    <a th:href="@{/faculty/exams}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create & Publish Exam</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let questionCount = 1;
        function addQuestionRow() {
            questionCount++;
            const container = document.getElementById('questionsContainer');
            const row = document.createElement('div');
            row.className = 'question-row';
            row.style = 'background: var(--color-surface-hover); padding: var(--space-4); border-radius: var(--radius-md);';
            row.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
                    <strong>Question ${questionCount}</strong>
                    <div style="display: flex; align-items: center; gap: var(--space-2);">
                        <label class="form-label" style="margin-bottom: 0;">Max Marks:</label>
                        <input type="number" step="0.5" name="maxMarks" value="10.0" class="form-control" style="width: 90px;" required>
                    </div>
                </div>
                <textarea name="questionTexts" rows="2" class="form-control" placeholder="Enter question statement..." required></textarea>
            `;
            container.appendChild(row);
        }
    </script>
</section>
</body>
</html>
