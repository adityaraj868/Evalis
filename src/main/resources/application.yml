spring:
  application:
    name: exam-review-system
  profiles:
    active: dev
  jpa:
    open-in-view: true
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

---
# Development Profile (Default / Local)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:examreviewdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Production Profile (MySQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam_review_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

---
# Render Cloud Profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exam_review_db}
    username: ${SPRING_DATASOURCE_USERNAME:examuser}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
